<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secure Question Paper System</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav><b>Secure Question Paper System</b>
{% if session.get('user_id') %}<span>{{ session.username }} ({{ session.role }}) | <a href="{{ url_for('logout') }}">Logout</a></span>{% endif %}
</nav>
<main>
{% with messages = get_flashed_messages() %}{% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main>
</body>
</html>
